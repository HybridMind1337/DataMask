name: "Bug Report"
description: "Report a bug or unexpected behavior in DataMask"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please ensure you do **NOT** paste raw production PII, secret keys, or real database passwords in this report.
  - type: input
    id: version
    attributes:
      label: "DataMask Version"
      description: "Run `datamask version` to find this."
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: "Database Engine"
      options:
        - "PostgreSQL"
        - "MySQL"
        - "MariaDB"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Describe the steps required to trigger the issue."
      placeholder: |
        1. Run `datamask mask --config datamask.yaml`
        2. Inspect output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "CLI Logs or Error Output"
      description: "Paste sanitized output here (ensure no real PII is included)."
      render: shell
