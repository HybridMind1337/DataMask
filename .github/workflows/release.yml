name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build multi-arch binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/HybridMind1337/DataMask/internal/cli.version=${GITHUB_REF_NAME}" -o dist/datamask-linux-amd64 ./cmd/datamask
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/HybridMind1337/DataMask/internal/cli.version=${GITHUB_REF_NAME}" -o dist/datamask-linux-arm64 ./cmd/datamask
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/HybridMind1337/DataMask/internal/cli.version=${GITHUB_REF_NAME}" -o dist/datamask-darwin-amd64 ./cmd/datamask
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/HybridMind1337/DataMask/internal/cli.version=${GITHUB_REF_NAME}" -o dist/datamask-darwin-arm64 ./cmd/datamask
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/HybridMind1337/DataMask/internal/cli.version=${GITHUB_REF_NAME}" -o dist/datamask-windows-amd64.exe ./cmd/datamask
          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Build and push Docker image to GitHub Packages
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/datamask:latest
            ghcr.io/${{ env.OWNER_LC }}/datamask:${{ github.ref_name }}
